<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Barbershop Bingo — Redesign Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c; --bg2:#1a1f29; --card:#1d2330; --line:#2d3444;
    --text:#f2e9da; --muted:#cabfa9; --gold:#c9a227; --gold2:#e0bc4a;
    --red:#a3352c; --red2:#b8402f; --on-red:#f9f3e6; --blue:#24406e;
    --ok:#5fb67a; --taken:#2a303c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Archivo,Verdana,sans-serif;line-height:1.55;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  /* fine diagonal lines like the original site */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:repeating-linear-gradient(118deg,rgba(242,233,218,.028) 0 1px,transparent 1px 6px),
      linear-gradient(160deg,#171a21 0%,var(--bg) 55%,#131826 100%)}
  body{background:transparent}
  html{background:var(--bg)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3,.serif{font-family:Archivo,Verdana,sans-serif;font-weight:800;letter-spacing:-.02em}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;transition:.2s}
  .btn-gold{background:var(--red);color:var(--on-red)}
  .btn-gold:hover{background:var(--red2)}
  .btn-ghost{border-color:var(--line);color:var(--text);background:transparent}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold2)}
  .eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:600}

  /* header */
  header::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:4px;background:repeating-linear-gradient(-45deg,#a3352c 0 10px,#f2e9da 10px 20px,#24406e 20px 30px,#f2e9da 30px 40px);background-size:200% 100%;animation:stripe 12s linear infinite;opacity:.85}
  @keyframes stripe{to{background-position:-400px 0}}
  header{position:sticky;top:0;z-index:40;background:rgba(18,21,28,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;color:var(--text);transition:color .2s}
  .logo:hover{color:var(--gold2)}
  .logo img{height:40px;display:none}
  .logo .word{font-family:Archivo,Verdana,sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em}
  .logo .word span{color:var(--gold)}
  .links{display:flex;gap:26px;font-size:14px;color:var(--muted)}
  .links a:hover{color:var(--text)}
  .right{display:flex;align-items:center;gap:12px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:6px 10px;font:600 12px Archivo,Verdana,sans-serif;cursor:pointer}
  .lang button.on{background:var(--gold);color:#171310}
  .nav .btn{padding:9px 16px;font-size:14px}

  /* hero */
  .hero{position:relative;padding:110px 0 90px;background:
    radial-gradient(900px 500px at 80% 10%,rgba(201,162,39,.10),transparent 60%),
    radial-gradient(700px 400px at 0% 100%,rgba(36,64,110,.22),transparent 60%);}
  .hero .pole{display:none;position:absolute;right:6%;top:70px;width:34px;height:300px;border-radius:17px;opacity:.5;
    background:repeating-linear-gradient(135deg,#a3352c 0 18px,#f2e9da 18px 36px,#24406e 36px 54px,#f2e9da 54px 72px);
    background-size:100% 200px;animation:pole 6s linear infinite;box-shadow:0 0 0 6px #232833}
  @keyframes pole{to{background-position:0 200px}}
  .motif{position:absolute;right:-60px;top:50%;transform:translateY(-50%);color:var(--gold);opacity:.09;pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .hero{overflow:hidden}
  .hero h1{font-size:clamp(40px,7vw,78px);line-height:1.05;margin:14px 0 18px;max-width:760px}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{color:var(--muted);font-size:18px;max-width:560px;margin-bottom:30px}
  .cta{display:flex;flex-wrap:wrap;gap:12px}
  .badges{display:flex;flex-wrap:wrap;gap:22px;margin-top:44px;color:var(--muted);font-size:14px}
  .badges b{color:var(--text)}

  section{padding:80px 0}
  .sec-head{margin-bottom:36px}
  .sec-head h2{font-size:clamp(28px,4vw,42px);margin-top:8px}

  /* services */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;transition:.2s}
  .svc:hover{border-color:var(--gold);transform:translateY(-2px)}
  .svc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .svc h3{font-size:20px}
  .svc .price{color:var(--gold2);font-weight:600;white-space:nowrap}
  .svc p{color:var(--muted);font-size:14px;flex:1}
  .svc .dur{font-size:12px;color:var(--muted)}
  .svc button{margin-top:8px;align-self:flex-start;background:none;border:0;color:var(--gold);font:600 14px Archivo,Verdana,sans-serif;cursor:pointer;padding:0}
  .note{color:var(--muted);font-size:12px;margin-top:14px;font-style:italic}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .gallery a{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
  .gallery a:nth-child(1){grid-column:span 2;grid-row:span 2}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .gallery a:hover img{transform:scale(1.05)}

  /* info */
  .info{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:stretch}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .hours{width:100%;border-collapse:collapse;margin-top:12px}
  .hours td{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .hours td:last-child{text-align:right;color:var(--muted)}
  .hours tr.today td{color:var(--gold2);font-weight:600}
  .open-now{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(95,182,122,.18)}
  .contact-list{display:grid;gap:14px;margin:14px 0 20px}
  .contact-list small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .contact-list a:hover{color:var(--gold2)}
  .map{border-radius:12px;overflow:hidden;border:1px solid var(--line);height:240px}
  .map iframe{width:100%;height:100%;border:0;filter:grayscale(.4) invert(.9) hue-rotate(180deg)}

  footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:13px}
  footer .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  footer .fmid{grid-column:2;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  footer .fby{grid-column:3;justify-self:end;font-size:13px;line-height:1;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .dks{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1;letter-spacing:0;color:var(--text);font-weight:600;padding:4px 0;transition:color .2s}
  .dks b,.dks i{color:#a78bfa;font-style:normal;font-weight:700}
  .dks i{animation:dkblink 1.1s steps(1) infinite}
  .dks:hover{color:#c4b5fd}
  @keyframes dkblink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.dks i{animation:none}}
  @media(max-width:640px){footer .wrap{grid-template-columns:1fr}footer .fmid,footer .fby{grid-column:1;justify-self:center}}
  .owner-link{color:var(--gold);cursor:pointer;background:none;border:0;font:inherit;text-decoration:underline}

  /* mobile sticky book */
  .mbook{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:45;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  @media(min-width:700px){.overlay{align-items:center}}
  .modal{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px}
  @media(min-width:700px){.modal{border-radius:20px}}
  .m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .m-head h3{font-size:24px}
  .x{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .steps{display:flex;gap:6px;margin:12px 0 22px}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .steps i.on{background:var(--gold)}
  .step-title{font-weight:600;margin-bottom:12px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
  .opt:hover{border-color:#4a5263}
  .opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .opt small{color:var(--muted)}
  .avatar{width:38px;height:38px;border-radius:50%;background:#2c3240;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--gold2);flex:none}
  .opt .l{display:flex;align-items:center;gap:12px}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
  .day{flex:none;width:62px;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;cursor:pointer;color:var(--text);font:inherit}
  .day small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
  .day b{font-size:20px}
  .day.sel{border-color:var(--gold);background:#2b2512}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .slot{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 14px Archivo,Verdana,sans-serif;cursor:pointer}
  .slot:disabled{background:var(--taken);color:#6b7180;text-decoration:line-through;cursor:not-allowed;border-color:transparent}
  .slot.sel{background:var(--gold);color:#171310;border-color:var(--gold)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
  .btn svg{width:18px;height:18px;flex:none}
  .btn-wa{background:#25D366;color:#08361c}
  .btn-wa:hover{background:#3ae27a}
  .cards{display:grid;gap:10px;margin-top:14px}
  .link-card{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);color:var(--text);transition:border-color .2s,transform .2s,background .2s}
  .link-card:hover{transform:translateY(-2px);background:#20263200;border-color:var(--gold)}
  .link-card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
  .link-card .ic svg{width:22px;height:22px}
  .link-card .tx{display:flex;flex-direction:column;min-width:0}
  .link-card b{font-size:15px}
  .link-card small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-card .arr{width:18px;height:18px;margin-left:auto;color:var(--muted);flex:none;transition:transform .2s,color .2s}
  .link-card:hover .arr{transform:translateX(3px);color:var(--gold2)}
  .lc-map .ic{background:var(--gold);color:#171310}
  .lc-wa .ic{background:#25D366;color:#fff}
  .lc-wa:hover{border-color:#25D366}
  .lc-ig .ic{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
  .lc-ig:hover{border-color:#d6249f}
  .wa-float{position:fixed;right:20px;bottom:20px;z-index:44;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .2s}
  .wa-float:hover{transform:scale(1.08)}
  .wa-float svg{width:30px;height:30px}
  body.staff-mode>.wa-float{display:none}
  @media(max-width:860px){.wa-float{bottom:84px;right:16px;width:52px;height:52px}}
  .price s,.tile span s{color:var(--muted);font-weight:400;font-size:.8em;margin-left:4px}
  .save{font-style:normal;align-self:flex-start;background:rgba(95,182,122,.15);color:#7fd39a;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
  .svc.deal,.tile.deal{border-color:rgba(201,162,39,.45)}
  .phone-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:8px}
  .phone-row select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 10px;color:var(--text);font:15px Archivo,Verdana,sans-serif;min-width:0}
  .phone-row select:focus{outline:none;border-color:var(--gold)}
  /* simple staff panel */
  .sp-top{display:flex;gap:10px;margin-bottom:14px}
  .ppl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .ppl>span{font-weight:600}
  .ppl-seg{display:flex;gap:6px}
  .ppl-seg button{width:46px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 17px Archivo,Verdana,sans-serif;cursor:pointer}
  .ppl-seg button.on{border-color:var(--gold);background:#2b2512;color:var(--gold2)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .mode{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
  .mode b{font-size:14px}.mode small{color:var(--muted);font-size:12px}
  .mode.sel{border-color:var(--gold);background:#2b2512}
  .pchips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
  .pchip{flex:1;min-width:0;text-align:left;border:1px dashed var(--line);background:none;color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit}
  .pchip small{display:block;color:var(--muted);font-size:11px}
  .pchip b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3}
  .pchip.set{border-style:solid}
  .pchip.on{border:1px solid var(--gold);background:#2b2512}
  .summary .pline b{text-align:right}
  .summary .pline span{white-space:nowrap}
  .summary .ptotal{border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
  .gtag{font-style:normal;font-size:11px;font-weight:600;color:var(--gold2);background:#2b2512;border:1px solid rgba(201,162,39,.4);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .pinfo .gtag{margin-left:6px;vertical-align:middle}
  .offday{font-size:13px;color:var(--muted);margin-top:-4px}
  .legend[hidden]{display:none!important}
  #askOv{z-index:80}
  .modal.ask{max-width:420px;padding:26px 22px 22px;text-align:center}
  .modal.ask h3{font-size:21px;margin-bottom:6px}
  .ask-who{color:var(--muted);font-size:14px;margin-bottom:14px}
  .ask-who b{color:var(--text)}
  .ask-q{margin-bottom:18px;line-height:1.45}
  .ask-btns{display:flex;flex-direction:column;gap:10px}
  .ask-btns .btn{width:100%;justify-content:center;padding:14px}
  .ask-btns .owner-link{margin:4px auto 0}
  .sp-push{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:var(--muted)}
  .sp-push svg{flex:none;width:22px;height:22px;color:var(--gold2)}
  .sp-push p{margin:0;flex:1;line-height:1.4}
  .sp-push b{color:var(--text);font-weight:600}
  .sp-push .btn{flex:none;padding:9px 14px;font-size:14px}
  .sp-push.on{padding:8px 14px;font-size:13px;border-color:rgba(95,182,122,.35)}
  .sp-push.on svg{color:var(--ok)}
  .sp-push .owner-link{margin:0;flex:none}
  @media(max-width:420px){.sp-push:not(.on){flex-wrap:wrap}.sp-push:not(.on) .btn{width:100%;justify-content:center}}
  .sp-top .btn-gold{flex:1;justify-content:center}
  .sp-filter{margin-bottom:14px}
  .sp-wait{background:#231f14;border:1px solid rgba(201,162,39,.45);border-radius:16px;padding:14px;margin-bottom:18px}
  .sp-wait h4{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .sp-wait h4 em{font-style:normal;background:var(--gold);color:#171310;border-radius:999px;padding:1px 9px;font-size:13px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px}
  .pinfo{display:flex;flex-direction:column;min-width:0}
  .pinfo b{font-size:15px}.pinfo span{color:var(--muted);font-size:13px}.pinfo .pwhen{color:var(--gold2);font-weight:600}
  .pact{display:flex;gap:8px}.pact .btn,.ract .btn{padding:10px 14px;font-size:14px}
  .sp-h{font-size:16px;margin:4px 0 10px}
  .sp-days{margin-bottom:12px}
  .slist{display:grid;gap:8px}
  .srow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .srow.open{border-color:var(--gold)}
  .srow.past{opacity:.5}
  .srow.brk{background:repeating-linear-gradient(45deg,#1d2330 0 10px,#202634 10px 20px)}
  .srow .rt{font-weight:700;font-size:16px;min-width:52px;display:flex;flex-direction:column;line-height:1.2}
  .srow .rt small{color:var(--muted);font-weight:400;font-size:12px}
  .srow .rb{display:flex;flex-direction:column;min-width:0;flex:1}
  .srow .rb b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .rb span{color:var(--muted);font-size:13px}
  .srow .tag{font-style:normal;background:rgba(201,162,39,.18);color:var(--gold2);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .srow .who{font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text);white-space:nowrap}
  .srow .who.b0{border-color:#c9a227}.srow .who.b1{border-color:#5b82c4}.srow .who.b2{border-color:#b8402f}
  .ract{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px}
  .sp-switch{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;font-size:15px}
  .sp-switch input{display:none}
  .sp-switch span{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
  .sp-switch span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:.2s}
  .sp-switch input:checked+span{background:var(--gold)}
  .sp-switch input:checked+span::after{left:21px;background:#171310}
  .sp-btns{display:flex;gap:10px;margin-top:6px}
  .day.off{background:rgba(163,53,44,.18);border-color:rgba(214,92,76,.7);color:#f0a79c}
  .day.off small{color:#e58a7f}
  .day.off.sel{background:rgba(163,53,44,.34);border-color:#e0685a;box-shadow:0 0 0 1px #e0685a inset}
  .off-note{color:#f0a79c!important}
  .off-note{font-style:normal!important}
  .sp-off{background:#1f2a22;border:1px solid #2f5a3c;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;display:grid;gap:8px}
  .sp-off .btn{justify-self:start;padding:8px 14px;font-size:14px}
  .off-warn{color:#e0bc4a;font-weight:500;font-size:13px}
  .sp-offbtn{margin-bottom:12px;padding:9px 14px;font-size:14px}

const SVC=[[6,30],[3,15],[2,10],[5,15],[5,15],[10,30],[8,45,9],[28,120,31]];
// wd = weekly day off (0 Sunday … 6 Saturday): Albini Saturdays, Redoni Mondays, Lorisi Wednesdays (same list in api.php)
const BARBERS=[{n:"Albini",i:"A",wd:6},{n:"Redoni",i:"R",wd:1},{n:"Lorisi",i:"L",wd:3}];
// 30-minute slots, 10:00 – 20:30 start (closes 21:00)
const TIMES=[];for(let m=600;m<=1230;m+=30)TIMES.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
// Prerja + Rregullimi counts as one half-hour appointment: booked at 10:00, the next client can come at 10:30 (same in api.php)
const SLOT_LEN={6:1};
const slotsLen=svc=>SLOT_LEN[svc]??Math.ceil(SVC[svc][1]/30);
const priceHTML=i=>SVC[i][2]?`€${SVC[i][0]} <s>€${SVC[i][2]}</s>`:`€${SVC[i][0]}`;
const saveHTML=i=>'';

const STAR=6;
const HIDE_TIME=[2];   // Larja e flokëve: no time shown
const durTxt=i=>HIDE_TIME.includes(i)?'':SVC[i][1]>=60?(SVC[i][1]/60)+' h':SVC[i][1]+' '+t('min');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- shared schedule (in the real version this lives in a database) ---------- */
let bookings=[];let nextId=1;
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){return new Date(k+'T00:00')}
function dayList(n=14){const a=[];const b=new Date();b.setHours(0,0,0,0);for(let i=0;i<n;i++){const d=new Date(b);d.setDate(b.getDate()+i);a.push(d)}return a}
function weeklyOff(barber,day){return BARBERS[barber]&&fromKey(day).getDay()===BARBERS[barber].wd}
function isOff(barber,day){return weeklyOff(barber,day)||bookings.some(b=>b.barber===barber&&b.day===day&&b.src==='off')}
const offDayName=barber=>t('days')[(BARBERS[barber].wd+6)%7];
function setDayOff(barber,day,on){   // offline demo version (shared-database version below)
  bookings=bookings.filter(b=>!(b.barber===barber&&b.day===day&&b.src==='off'));
  if(on)bookings.push({id:nextId++,barber,day,slot:0,len:TIMES.length,svc:null,name:'',tel:'',notes:'',src:'off',status:'confirmed'});
  persist();adm.open=null;renderAdmin();toast(on?t('offSet'):t('offRemoved'));
}
function covering(barber,day,idx){return bookings.find(b=>b.barber===barber&&b.day===day&&idx>=b.slot&&idx<b.slot+b.len)}
function isPast(day,idx){const d=fromKey(day);const [h,m]=TIMES[idx].split(':');d.setHours(+h,+m);return d<=new Date()}
function canFit(barber,day,idx,len,checkPast=true){
  if(idx+len>TIMES.length)return false;
  if(weeklyOff(barber,day))return false;
  if(checkPast&&isPast(day,idx))return false;
  for(let i=idx;i<idx+len;i++)if(covering(barber,day,i))return false;
  return true;
}
// demo data so the schedule looks lived-in
function seed(){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const names=["Arben K.","Driton M.","Luan B.","Faton H.","Blerim S.","Gent R.","Ilir D.","Valon T.","Egzon Q.","Kushtrim A."];
  const srcs=["web","web","web","phone","phone","walkin","insta"];
  dayList(14).forEach(d=>{const day=key(d);
    BARBERS.forEach((_,b)=>{
      for(let i=0;i<TIMES.length;i++){
        if(rnd()<0.3){const svc=Math.floor(rnd()*SVC.length),len=slotsLen(svc);
          if(canFit(b,day,i,len,false)){bookings.push({id:nextId++,barber:b,day,slot:i,len,svc,name:names[Math.floor(rnd()*names.length)],tel:"+383 4"+Math.floor(rnd()*9)+" "+String(Math.floor(rnd()*900)+100)+" "+String(Math.floor(rnd()*900)+100),src:srcs[Math.floor(rnd()*srcs.length)],notes:"",status:rnd()<0.25?"pending":"confirmed",lang:["sq","sq","sq","en","de"][Math.floor(rnd()*5)]});i+=len-1}}
      }
      if(rnd()<0.6){const i=6+Math.floor(rnd()*4);if(canFit(b,day,i,1,false))bookings.push({id:nextId++,barber:b,day,slot:i,len:1,svc:null,name:"",tel:"",src:"brk",notes:""})}
    });
  });
}

// Albanian names written out by hand: many browsers don't have Albanian date names built in
const SQ_DAY_SHORT=["Hën","Mar","Mër","Enj","Pre","Sht","Die"],SQ_MON_SHORT=["jan","shk","mar","pri","maj","qer","korr","gush","sht","tet","nën","dhj"];
function fmtDay(d,opts){
  if(lang!=='sq')return d.toLocaleDateString(LOC[lang],opts);
  const w=(d.getDay()+6)%7,parts=[];
  if(opts.weekday)parts.push(opts.weekday==='long'?T.sq.days[w]:SQ_DAY_SHORT[w]);
  const dm=[];if(opts.day)dm.push(d.getDate());if(opts.month)dm.push(opts.month==='long'?T.sq.months[d.getMonth()]:SQ_MON_SHORT[d.getMonth()]);
  if(dm.length)parts.push(dm.join(' '));
  return parts.join(', ');
}

function ccOptions(sel){
  const li={sq:1,en:2,de:3}[lang];
  return COUNTRIES.map(c=>`<option value="${c[0]}" ${c[0]===sel?'selected':''}>${c[0]}  ${c[li]}</option>`).join('')+`<option value="other" ${sel==='other'?'selected':''}>${t('ccOther')}</option>`;
}
// returns "+383 44123456" or null if not a valid international number
function fullPhone(){
  let local=String(st.tel||'').trim();
  let num;
  if(st.cc==='other'){
    const d=local.replace(/[^\d+]/g,'').replace(/^00/,'+');
    if(!/^\+[1-9]\d{7,14}$/.test(d))return null;
    num=d;
  }else{
    let d=local.replace(/[^\d+]/g,'');
    if(d.startsWith('+')||d.startsWith('00')){                       // they typed the full number themselves
      d=d.replace(/^00/,'+');return /^\+[1-9]\d{7,14}$/.test(d)?d:null;
    }
    d=d.replace(/^0+/,'');                                           // 044… → 44…
    if(d.length<6||d.length>12)return null;
    num=st.cc+' '+d;
  }
  return num;
}

function openBook(pre={}){
  st={step:0,people:1,svcs:[null],cur:0,mode:'together',barber:null,day:null,time:null,name:"",tel:"",cc:"+383",notes:"",done:false,skipBarber:false};
  if(pre.svc!==undefined)st.svcs=[pre.svc];   // stays on the first step so a group can still be chosen
  if(pre.barber!==undefined){st.barber=pre.barber;st.skipBarber=true}
  document.getElementById('bookOv').classList.add('show');document.body.style.overflow='hidden';
  renderStep();
}
function customerSlots(day){return TIMES.map((time,idx)=>({time,idx,taken:!groupPlan(day,idx)}))}
/* who sits where at a chosen time, for 1–3 people: [{barber,slot,svc}] or null (same rules in api.php)
   together: same time, different barbers · seq: one after another with the same barber */
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function groupPlan(day,idx){
  const svcs=st.svcs,lens=svcs.map(slotsLen);
  if(svcs.length===1||st.mode==='seq'){
    const total=lens.reduce((a,c)=>a+c,0);
    const cands=st.barber>=0?[st.barber]:BARBERS.map((_,i)=>i);
    for(const b of cands)if(canFit(b,day,idx,total)){let at=idx;return svcs.map((svc,k)=>{const r={barber:b,slot:at,svc};at+=lens[k];return r})}
    return null;
  }
  for(const p of PERMS){
    if(st.barber>=0&&p[0]!==st.barber)continue;
    if(svcs.every((svc,k)=>canFit(p[k],day,idx,lens[k])))return svcs.map((svc,k)=>({barber:p[k],slot:idx,svc}));
  }
  return null;
}
function dayClosed(k){   // no times possible at all on this day for this booking
  if(st.people>1&&st.mode==='together'){
    if(st.barber>=0&&isOff(st.barber,k))return true;
    return BARBERS.filter((_,b)=>!isOff(b,k)).length<st.people;
  }
  return st.barber===-1?BARBERS.every((_,b)=>isOff(b,k)):isOff(st.barber,k);
}
function setPeople(k){
  const a=st.svcs.slice(0,k);while(a.length<k)a.push(null);
  st.people=k;st.svcs=a;st.cur=Math.max(0,a.findIndex(v=>v===null));st.time=null;renderStep();
}
function pickSvc(i){
  st.svcs[st.cur]=i;st.time=null;
  const nxt=st.svcs.findIndex(v=>v===null);
  if(nxt>=0){st.cur=nxt;renderStep();const m=document.querySelector('#bookOv .modal');if(m)m.scrollTop=0;return}
  renderStep();clearTimeout(pick.h);pick.h=setTimeout(()=>go(1),220);
}
function pick(field,val){
  st[field]=val;st.time=null;renderStep();
  clearTimeout(pick.h);pick.h=setTimeout(()=>go(1),220);
}
function renderStep(){

  document.getElementById('err').textContent='';

      <p>${t('doneP')}</p><p style="font-size:13px">${t('cancelInfo')}</p>
      <button class="btn btn-gold" style="margin-top:14px" onclick="closeAll()">${t('doneBtn')}</button></div>`;
    return;
  }
  if(st.step===0){
    const n=st.people;
    body.innerHTML=`<div class="ppl"><span>${t('pplQ')}</span><div class="ppl-seg">${[1,2,3].map(k=>`<button class="${n===k?'on':''}" onclick="setPeople(${k})" aria-label="${k}">${k}</button>`).join('')}</div></div>
      ${n>1?`<div class="modes">${['together','seq'].map(m=>`<button class="mode ${st.mode===m?'sel':''}" onclick="st.mode='${m}';st.time=null;renderStep()"><b>${t(m==='together'?'modeTog':'modeSeq')}</b><small>${t(m==='together'?'modeTogS':'modeSeqS')}</small></button>`).join('')}</div>
      <div class="pchips">${st.svcs.map((v,k)=>`<button class="pchip ${k===st.cur?'on':''} ${v!==null?'set':''}" onclick="st.cur=${k};renderStep()"><small>${t('person').replace('{n}',k+1)}</small><b>${v===null?'—':t('svcs')[v][0]}</b></button>`).join('')}</div>`:''}
      <div class="step-title">${n>1?t('svcFor').replace('{n}',st.cur+1):t('s1')}</div><div class="tiles">`+SVC_ORDER.map(i=>[t('svcs')[i],i]).map(([s,i])=>`
      <button class="tile ${st.svcs[st.cur]===i?'sel':''} ${SVC[i][2]?'deal':''} ${i===STAR?'star':''}" onclick="pickSvc(${i})">${i===STAR?`<span class="star-badge">★<span class="lbl"> ${t('popular')}</span></span>`:''}<b>${s[0]}</b>${saveHTML(i)}<small>${durTxt(i)}</small><span>${priceHTML(i)}</span></button>`).join('')+`</div>`;
    next.disabled=!st.svcs.every(v=>v!==null);
  }
  if(st.step===1){
    const opts=[{i:-1,n:t('any'),s:t('anySub'),a:'★'}].concat(BARBERS.map((b,i)=>({i,n:b.n,s:'Barber',a:b.i})));
    const tog=st.people>1&&st.mode==='together';
    body.innerHTML=`<div class="step-title">${tog?t('s2Tog'):t('s2')}</div>${tog?`<p class="note" style="margin:-6px 0 12px">${t('s2TogS')}</p>`:''}<div class="opts">`+opts.map(o=>`
      <button class="opt ${st.barber===o.i?'sel':''}" onclick="pick('barber',${o.i})"><div class="l"><div class="avatar">${o.a}</div><div><b>${o.n}</b><br><small>${o.s}</small></div></div></button>`).join('')+`</div>`;
    next.disabled=st.barber===null;
  }
  if(st.step===2){
    const days=dayList();if(!st.day)st.day=key(days[0]);
    const slots=customerSlots(st.day);
    body.innerHTML=`<div class="step-title">${t('s3')}</div>
      <div class="days">`+days.map((d,i)=>`<button class="day ${key(d)===st.day?'sel':''} ${dayClosed(key(d))?'off':''}" onclick="st.day='${key(d)}';st.time=null;renderStep()"><small>${i===0?t('today'):fmtDay(d,{weekday:'short'})}</small><b>${d.getDate()}</b><small>${dayClosed(key(d))?t('offShort'):fmtDay(d,{month:'short'})}</small></button>`).join('')+`</div>
      ${st.barber>=0&&isOff(st.barber,st.day)?`<p class="note off-note">${t('custOff').replace('{b}',BARBERS[st.barber].n)}</p>`:dayClosed(st.day)?`<p class="note off-note">${t('custFew').replace('{n}',st.people)}</p>`:slots.every(s=>s.taken)?`<p class="note">${t('noSlots')}</p>`:''}
      `+(dayClosed(st.day)?'':`<div class="slots">`+slots.map(s=>`<button class="slot ${st.time===s.idx?'sel':''}" ${s.taken?'disabled':''} onclick="st.time=${s.idx};renderStep()">${s.time}</button>`).join('')+`</div>`)+`

        </div>
        ${st.cc==='other'?`<small class="note" style="margin:0">${t('telOtherPh')}</small>`:''}
      </div>
      <div class="field"><label>${t('notes')}</label><textarea rows="2" oninput="st.notes=this.value">${esc(st.notes)}</textarea></div>`;

function go(dir){
  if(dir>0&&st.step===3){
    if(st.name.trim().length<2){document.getElementById('err').textContent=t('errNameOnly');return}
    if(!fullPhone()){document.getElementById('err').textContent=t('errPhone');return}
    const plan=groupPlan(st.day,st.time);
    if(!plan){st.step=2;st.time=null;renderStep();return}
    const gid=plan.length>1?nextId:null;
    const rows=plan.map((p,k)=>({id:nextId++,barber:p.barber,day:st.day,slot:p.slot,len:slotsLen(p.svc),svc:p.svc,name:st.name.trim(),tel:fullPhone(),notes:st.notes,src:"web",status:"pending",lang,grp:gid,gi:k+1,gn:plan.length}));
    bookings.push(...rows);persist();st.done=rows;renderStep();rows.forEach(notify);sendTelegram(rows[0]);return;
  }
  let s=st.step+dir;
  if(st.skipBarber&&s===1)s+=dir;
  st.step=Math.max(0,Math.min(3,s));renderStep();
}

/* in-app banner: tap opens the booking, swipe up / left / right (or ×) hides it */
function dismissPush(dx,dy){
  const el=document.getElementById('push');clearTimeout(notify.h);
  el.style.transition='transform .28s ease,opacity .28s ease';
  el.style.transform=Math.abs(dx)>Math.abs(dy)?`translateX(${dx>0?120:-120}%)`:'translateY(-180%)';el.style.opacity='0';
  setTimeout(()=>{el.classList.remove('show');el.style.transition='none';el.style.transform='';el.style.opacity='';void el.offsetWidth;el.style.transition=''},300);
}
(function(){
  const el=document.getElementById('push');let x0=0,y0=0,dx=0,dy=0,drag=false,moved=false;
  const start=(x,y)=>{x0=x;y0=y;dx=dy=0;drag=true;moved=false;el.style.transition='none';clearTimeout(notify.h)};
  const move=(x,y)=>{if(!drag)return;dx=x-x0;dy=Math.min(0,y-y0);if(Math.abs(dx)>8||dy<-8)moved=true;
    if(moved){el.style.transform=`translate(${dx}px,${dy}px)`;el.style.opacity=String(Math.max(.2,1-(Math.abs(dx)+Math.abs(dy))/260))}};
  const end=()=>{if(!drag)return;drag=false;
    if(Math.abs(dx)>70||dy<-35)dismissPush(dx,dy);
    else{el.style.transition='';el.style.transform='';el.style.opacity='';notify.h=setTimeout(()=>el.classList.remove('show'),5000)}};
  el.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);if(moved)e.preventDefault()},{passive:false});
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',e=>{if(e.target.closest('.px'))return;start(e.clientX,e.clientY);e.preventDefault()});
  addEventListener('mousemove',e=>move(e.clientX,e.clientY));addEventListener('mouseup',end);
  el.addEventListener('click',e=>{if(moved){moved=false;return}if(!e.target.closest('.px'))openFromPush()});
})();
function openFromPush(){
  document.getElementById('push').classList.remove('show');
  const b=bookings.find(x=>x.id===lastPush);if(!b)return;
  closeAll();openOwner();adm.day=b.day;
  if(adm.auth&&!mine(b)){adm.auth=false;adm.user=null}
  if(!adm.auth)adm.pick=b.barber;
  if(adm.auth){adm.open=b.id;adm.view='grid';markRead(b.id)}
  renderAdmin();
}
function markRead(id){notifs.forEach(n=>{if(n.bid===id)n.read=true});persist()}
function mine(b){return adm.user===-1||adm.user===null||b.barber===adm.user}
function unread(){return notifs.filter(n=>!n.read&&bookings.some(b=>b.id===n.bid&&mine(b))).length}
function isNew(id){return notifs.some(n=>n.bid===id&&!n.read)}



/* ---------- Telegram: send each online booking to that barber's bot ---------- */
function sendTelegram(b){
  if(!TELEGRAM_WORKER_URL)return;
  const d=fromKey(b.day);
  const pad=n=>String(n).padStart(2,'0');
  fetch(TELEGRAM_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    barber:['albin','redon','loris'][b.barber],
    name:b.name, phone:b.tel,
    service:T.sq.svcs[b.svc][0]+' ('+SVC[b.svc][1]+' min)',
    date:T.sq.days[(d.getDay()+6)%7]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(),
    time:TIMES[b.slot], lang:LANG_NAME[b.lang||'sq'], notes:b.notes||''
  })}).catch(()=>{});
}

/* ---------- confirming bookings to the client ---------- */
function waNumber(tel){let d=String(tel).replace(/[^\d+]/g,'');if(d.startsWith('+'))d=d.slice(1);else if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='383'+d.slice(1);return d}
// date written out by hand, so it's correct in Albanian too (browsers often lack Albanian date names)
function clientDate(day,L){
  const d=fromKey(day),T2=T[L],w=T2.days[(d.getDay()+6)%7],m=T2.months[d.getMonth()];
  return L==='de'?`${w}, ${d.getDate()}. ${m}`:L==='en'?`${w}, ${d.getDate()} ${m}`:`${w}, ${d.getDate()} ${m}`;
}
function groupOf(b){   // every booking of the same group (a barber's panel only loads his own, so the server sends the full list)
  if(b.group&&b.group.length)return b.group;
  return b.grp?bookings.filter(x=>x.grp===b.grp).map(x=>({slot:x.slot,svc:x.svc,barber:x.barber})):[b];
}
function clientMsg(b,kind){
  const L=b.lang||'sq',T2=T[L];
  const g=groupOf(b);
  if(g.length>1){
    const gs=[...g].sort((a,c)=>a.slot-c.slot||a.barber-c.barber);
    const lines=gs.map(x=>'• '+TIMES[x.slot]+' · '+T2.svcs[x.svc][0]+' · '+BARBERS[x.barber].n).join('\n');
    return T2[kind==='ok'?'msgOkG':'msgNoG'].replace('{name}',b.name.split(' ')[0]).replace('{n}',gs.length)
      .replace('{date}',clientDate(b.day,L)).replace('{lines}',lines).replace('{times}',[...new Set(gs.map(x=>TIMES[x.slot]))].join(', '));
  }
  return T2[kind==='ok'?'msgOk':'msgNo']
    .replace('{name}',b.name.split(' ')[0]).replace('{barber}',BARBERS[b.barber].n)
    .replace('{date}',clientDate(b.day,L))
    .replace('{time}',TIMES[b.slot]).replace('{service}',T2.svcs[b.svc][0]);
}
/* barber chooses WhatsApp or Viber once per device; Confirm / Decline / Resend use it */
let msgApp='wa';   // confirmations go out on WhatsApp
const APP_NAME={wa:'WhatsApp',viber:'Viber'};
function setApp(a){msgApp=a;try{localStorage.setItem('bb_app',a)}catch(e){};renderAdmin()}
function openWhatsApp(b,kind){
  const text=clientMsg(b,kind),num=waNumber(b.tel);
  if(msgApp==='viber'){
    try{navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{})}catch(e){}   // backup in case Viber ignores the draft
    const url='viber://chat?number=%2B'+num+'&draft='+encodeURIComponent(text);
    window.__lastWa=url;
    const a=document.createElement('a');a.href=url;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  }else{
    const phone=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(phone){   // straight into the WhatsApp app: the staff page stays as it is (no blank page when coming back)
      const url='whatsapp://send?phone='+num+'&text='+encodeURIComponent(text);
      window.__lastWa=url;location.href=url;
    }else{
      const url='https://wa.me/'+num+'?text='+encodeURIComponent(text);
      window.__lastWa=url; try{window.open(url,'_blank','noopener')}catch(e){}
    }
  }
}

    </div>`:''}`;

    :(offList.length?`<div class="sp-off">${t('dayOffBtn')}: ${offList.join(', ')}</div>`:`<p class="note" style="margin:0 0 10px">${t('offPick')}</p>`);
  el.innerHTML=`

/* ---------- shared database mode (Cloudflare Worker + D1) ----------

  login=async function(){

  markRead=function(id){

  saveAdd=async function(){

  setDayOff=async function(barber,day,on){

    adm.open=null;await loadStaff();
  };
  resetDemo=async function(){
    try{await api('/staff/reset',{method:'POST',body:{},staff:true});adm.view='grid';toast(t('resetDone'))}catch(e){toast(t('netErr'))}
    known=null;await loadStaff();
  };

  /* ---------- staff app: stays signed in on this phone + phone notifications ---------- */
  const SKEY='bb_staff';
  // the sign-in is kept in two places (localStorage + IndexedDB): iPhone can lose a fresh localStorage write
  // when the app is swiped away, IndexedDB is written to disk straight away
  const idb=(mode,fn)=>new Promise(res=>{try{
    const r=indexedDB.open('bingo-staff',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{const db=r.result;let q=null;try{const tx=db.transaction('kv',mode);q=fn(tx.objectStore('kv'));
      tx.oncomplete=()=>{db.close();res(q?q.result:null)};tx.onerror=tx.onabort=()=>{db.close();res(null)}}catch(e){db.close();res(null)}};
    r.onerror=()=>res(null)}catch(e){res(null)}});
  const saveCred=()=>{const v={cred:adm.cred,pick:adm.pick};try{localStorage.setItem(SKEY,JSON.stringify(v))}catch(e){}idb('readwrite',st=>st.put(v,SKEY));
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}};
  const loadCred=()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}};
  const clearCred=()=>{try{localStorage.removeItem(SKEY)}catch(e){}idb('readwrite',st=>st.delete(SKEY))};
  const rr=()=>{if(adm.auth&&adm.view==='grid')renderAdmin()};
  async function startSession(){
    adm.auth=true;adm.user=adm.pick;adm.view='grid';known=null;bookings=[];saveCred();
    renderAdmin();pushSync();await loadStaff();
    clearInterval(window.__poll);window.__poll=setInterval(loadStaff,8000);
  }
  // opening the staff page again signs the barber straight back in (no automatic sign-out)
  const _openOwner=openOwner;
  openOwner=function(){
    const s=loadCred();
    if(!adm.auth&&s&&s.cred){adm.cred=s.cred;adm.pick=s.pick;startSession()}
    _openOwner();
    pushPrep();
    if(!adm.auth&&!(s&&s.cred))idb('readonly',st=>st.get(SKEY)).then(v=>{   // backup copy
      if(v&&v.cred&&!adm.auth){adm.cred=v.cred;adm.pick=v.pick;startSession()}
    });
  };
  const _logout=logout;
  logout=function(){clearCred();pushOff();_logout()};            // "Dil" button: signs out and stops notifications on this phone
  window.pinChanged=function(){clearCred();_logout()};            // wrong/changed PIN: sign in again, notifications stay on
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&adm.auth)loadStaff()});

  const canPush=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isApp=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  const keyBytes=k=>{const s=atob(k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-k.length%4)%4));return Uint8Array.from(s,c=>c.charCodeAt(0))};
  const sameKey=(a,b)=>{if(!a)return false;a=new Uint8Array(a);return a.length===b.length&&a.every((x,i)=>x===b[i])};
  const regSW=async()=>{await navigator.serviceWorker.register('sw.js',{scope:'./'});return navigator.serviceWorker.ready};
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',()=>{if(adm.auth)loadStaff()});
  let pushState='';   // '' · install · off · on · blocked
  // ready before the PIN is typed, so the login tap itself can switch notifications on
  const pre={reg:null,key:null,job:null};
  function pushPrep(){
    if(!canPush()||pre.reg)return;
    regSW().then(r=>{pre.reg=r}).catch(()=>{});
    if(!pre.key)api('/push/key').then(d=>{pre.key=keyBytes(d.key)}).catch(()=>{});
  }
  function pushAsk(){
    if(!canPush()||Notification.permission==='denied')return;
    try{
      if(pre.reg&&pre.key)pre.job=pre.reg.pushManager.getSubscription().then(s=>s||pre.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pre.key}));
      if(Notification.permission==='default'){const p=Notification.requestPermission();pre.job=pre.job?pre.job.catch(()=>p):p}
    }catch(e){}
  }
  async function pushSync(){          // every time the app opens: make sure this phone gets notifications for whoever is signed in
    if(!canPush()){pushState=isIOS&&!isApp()?'install':'';rr();return}
    if(pre.job){try{await pre.job}catch(e){}pre.job=null}
    try{
      const reg=await regSW();let sub=await reg.pushManager.getSubscription();
      if(!sub&&Notification.permission==='granted'){   // allowed before but the link got lost: re-link silently, no tap needed
        const key=keyBytes((await api('/staff/push/key',{staff:true})).key);
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
      }
      if(sub){await api('/staff/push/subscribe',{method:'POST',body:sub.toJSON(),staff:true});pushState='on'}
      else pushState=Notification.permission==='denied'?'blocked':'off';
    }catch(e){pushState=pushState==='on'?'on':(Notification.permission==='denied'?'blocked':'off')}
    rr();
  }
  window.pushEnable=async function(){
    let perm;try{perm=await Notification.requestPermission()}catch(e){perm=Notification.permission}   // asked right inside the tap (iPhone rule)
    if(perm!=='granted'){pushState=perm==='denied'?'blocked':'off';rr();if(perm!=='denied')toast(t('pushFail'));return}
    try{
      const reg=await regSW();
      const key=keyBytes((await api('/staff/push/key',{staff:true})).key);
      let sub=await reg.pushManager.getSubscription();
      if(sub&&!sameKey(sub.options&&sub.options.applicationServerKey,key)){await sub.unsubscribe();sub=null}
      if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
      await api('/staff/push/subscribe',{method:'POST',body:sub.toJSON(),staff:true});
      pushState='on';rr();toast(t('pushOn'));
    }catch(e){pushState='off';rr();toast(t('pushFail'))}
  };
  window.pushTest=async function(){
    try{const d=await api('/staff/push/test',{method:'POST',body:{},staff:true});toast(d.ok?t('pushTestSent'):t('pushFail'))}catch(e){toast(t('netErr'))}
  };
  async function pushOff(){            // signing out: this phone stops getting notifications
    const cred=adm.cred;pushState='';
    if(!canPush()||!cred)return;
    try{
      const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
      // unlink from this account only; the phone keeps its permission, so the next account gets notifications without asking again
      if(sub)await api('/staff/push/unsubscribe',{method:'POST',body:{endpoint:sub.endpoint},staff:true,cred}).catch(()=>{});
    }catch(e){}
  }
  const bell='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  window.pushBarHTML=function(){
    if(pushState==='install')return `<div class="sp-push">${bell}<p>${t('pushInstall')}</p></div>`;
    if(pushState==='off')return `<div class="sp-push">${bell}<p>${t('pushWhy')}</p><button class="btn btn-gold" onclick="pushEnable()">${t('pushBtn')}</button></div>`;
    if(pushState==='blocked')return `<div class="sp-push">${bell}<p>${t('pushBlocked')}</p></div>`;
    if(pushState==='on')return `<div class="sp-push on">${bell}<p>${t('pushOn')}</p><button class="owner-link" onclick="pushTest()">${t('pushTest')}</button></div>`;
    return '';
  };
}

/* the staff page can be saved to the home screen as its own app ("Bingo Staff"); the public page never is */
function staffApp(){
  if(document.getElementById('staffManifest'))return;
  const add=(tag,a)=>{const e=document.createElement(tag);for(const k in a)e.setAttribute(k,a[k]);document.head.appendChild(e)};
  add('link',{id:'staffManifest',rel:'manifest',href:'staff.webmanifest'});
  add('link',{rel:'apple-touch-icon',href:'apple-touch-icon.png'});
  add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});
  add('meta',{name:'mobile-web-app-capable',content:'yes'});
  add('meta',{name:'apple-mobile-web-app-title',content:'Bingo Staff'});
  add('meta',{name:'apple-mobile-web-app-status-bar-style',content:'black'});
}

function checkStaff(){
  const on=location.hash==='#staff'||/[?&]staff\b/.test(location.search);
  document.body.classList.toggle('staff-mode',on);
  if(on){document.title='Bingo Staff';staffApp();openOwner()}
  else{document.getElementById('ownerOv').classList.remove('show');document.body.style.overflow=''}
}
window.addEventListener('hashchange',checkStaff);
if(!loadData()){seed();persist()}
checkStaff();
(function(){const tr=document.querySelector('.rtrack');if(!tr)return;const set=()=>{tr.style.animationDuration=Math.round(tr.scrollWidth/2/40)+'s'};set();addEventListener('resize',set)})();
document.querySelector('.rmarquee')?.addEventListener('click',e=>{if(!e.target.closest('a'))e.currentTarget.classList.toggle('paused')});
applyLang();
</script>
</body>
</html>
