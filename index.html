<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Barbershop Bingo — Redesign Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c; --bg2:#1a1f29; --card:#1d2330; --line:#2d3444;
    --text:#f2e9da; --muted:#cabfa9; --gold:#c9a227; --gold2:#e0bc4a;
    --red:#a3352c; --red2:#b8402f; --on-red:#f9f3e6; --blue:#24406e;
    --ok:#5fb67a; --taken:#2a303c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Archivo,Verdana,sans-serif;line-height:1.55;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3,.serif{font-family:Archivo,Verdana,sans-serif;font-weight:800;letter-spacing:-.02em}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;transition:.2s}
  .btn-gold{background:var(--red);color:var(--on-red)}
  .btn-gold:hover{background:var(--red2)}
  .btn-ghost{border-color:var(--line);color:var(--text);background:transparent}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold2)}
  .eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:600}

  /* header */
  header::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:4px;background:repeating-linear-gradient(-45deg,#a3352c 0 10px,#f2e9da 10px 20px,#24406e 20px 30px,#f2e9da 30px 40px);background-size:200% 100%;animation:stripe 12s linear infinite;opacity:.85}
  @keyframes stripe{to{background-position:-400px 0}}
  header{position:sticky;top:0;z-index:40;background:rgba(18,21,28,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;color:var(--text);transition:color .2s}
  .logo:hover{color:var(--gold2)}
  .logo img{height:40px;display:none}
  .logo .word{font-family:Archivo,Verdana,sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em}
  .logo .word span{color:var(--gold)}
  .links{display:flex;gap:26px;font-size:14px;color:var(--muted)}
  .links a:hover{color:var(--text)}
  .right{display:flex;align-items:center;gap:12px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:6px 10px;font:600 12px Archivo,Verdana,sans-serif;cursor:pointer}
  .lang button.on{background:var(--gold);color:#171310}
  .nav .btn{padding:9px 16px;font-size:14px}

  /* hero */
  .hero{position:relative;padding:110px 0 90px;background:
    radial-gradient(900px 500px at 80% 10%,rgba(201,162,39,.10),transparent 60%),
    radial-gradient(700px 400px at 0% 100%,rgba(36,64,110,.22),transparent 60%);}
  .hero .pole{display:none;position:absolute;right:6%;top:70px;width:34px;height:300px;border-radius:17px;opacity:.5;
    background:repeating-linear-gradient(135deg,#a3352c 0 18px,#f2e9da 18px 36px,#24406e 36px 54px,#f2e9da 54px 72px);
    background-size:100% 200px;animation:pole 6s linear infinite;box-shadow:0 0 0 6px #232833}
  @keyframes pole{to{background-position:0 200px}}
  .pole-vid{position:absolute;right:7%;top:50%;transform:translateY(-50%);height:100%;aspect-ratio:2/3;object-fit:cover;pointer-events:none;
    filter:brightness(.86) contrast(1.14) saturate(1.05);
    -webkit-mask-image:radial-gradient(ellipse 46% 50% at 50% 50%,#000 52%,transparent 96%);mask-image:radial-gradient(ellipse 46% 50% at 50% 50%,#000 52%,transparent 96%)}
  @media(max-width:860px){.pole-vid{right:-150px;height:90%;opacity:.2}}
  .motif{position:absolute;right:-60px;top:50%;transform:translateY(-50%);color:var(--gold);opacity:.07;pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .hero{overflow:hidden}
  .hero h1{font-size:clamp(40px,7vw,78px);line-height:1.05;margin:14px 0 18px;max-width:760px}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{color:var(--muted);font-size:18px;max-width:560px;margin-bottom:30px}
  .cta{display:flex;flex-wrap:wrap;gap:12px}
  .badges{display:flex;flex-wrap:wrap;gap:22px;margin-top:44px;color:var(--muted);font-size:14px}
  .badges b{color:var(--text)}

  section{padding:80px 0}
  .sec-head{margin-bottom:36px}
  .sec-head h2{font-size:clamp(28px,4vw,42px);margin-top:8px}

  /* services */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;transition:.2s}
  .svc:hover{border-color:var(--gold);transform:translateY(-2px)}
  .svc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .svc h3{font-size:20px}
  .svc .price{color:var(--gold2);font-weight:600;white-space:nowrap}
  .svc p{color:var(--muted);font-size:14px;flex:1}
  .svc .dur{font-size:12px;color:var(--muted)}
  .svc button{margin-top:8px;align-self:flex-start;background:none;border:0;color:var(--gold);font:600 14px Archivo,Verdana,sans-serif;cursor:pointer;padding:0}
  .note{color:var(--muted);font-size:12px;margin-top:14px;font-style:italic}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .gallery a{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
  .gallery a:nth-child(1){grid-column:span 2;grid-row:span 2}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .gallery a:hover img{transform:scale(1.05)}

  /* info */
  .info{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:stretch}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .hours{width:100%;border-collapse:collapse;margin-top:12px}
  .hours td{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .hours td:last-child{text-align:right;color:var(--muted)}
  .hours tr.today td{color:var(--gold2);font-weight:600}
  .open-now{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(95,182,122,.18)}
  .contact-list{display:grid;gap:14px;margin:14px 0 20px}
  .contact-list small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .contact-list a:hover{color:var(--gold2)}
  .map{border-radius:12px;overflow:hidden;border:1px solid var(--line);height:240px}
  .map iframe{width:100%;height:100%;border:0;filter:grayscale(.4) invert(.9) hue-rotate(180deg)}

  footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .owner-link{color:var(--gold);cursor:pointer;background:none;border:0;font:inherit;text-decoration:underline}

  /* mobile sticky book */
  .mbook{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:45;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  @media(min-width:700px){.overlay{align-items:center}}
  .modal{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px}
  @media(min-width:700px){.modal{border-radius:20px}}
  .m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .m-head h3{font-size:24px}
  .x{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .steps{display:flex;gap:6px;margin:12px 0 22px}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .steps i.on{background:var(--gold)}
  .step-title{font-weight:600;margin-bottom:12px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
  .opt:hover{border-color:#4a5263}
  .opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .opt small{color:var(--muted)}
  .avatar{width:38px;height:38px;border-radius:50%;background:#2c3240;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--gold2);flex:none}
  .opt .l{display:flex;align-items:center;gap:12px}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
  .day{flex:none;width:62px;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;cursor:pointer;color:var(--text);font:inherit}
  .day small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
  .day b{font-size:20px}
  .day.sel{border-color:var(--gold);background:#2b2512}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .slot{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 14px Archivo,Verdana,sans-serif;cursor:pointer}
  .slot:disabled{background:var(--taken);color:#6b7180;text-decoration:line-through;cursor:not-allowed;border-color:transparent}
  .slot.sel{background:var(--gold);color:#171310;border-color:var(--gold)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;gap:6px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;cursor:pointer;transition:.15s}
  .tile:hover{border-color:#4a5263;transform:translateY(-1px)}
  .tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2b2512}
  .tile b{font-size:15px;line-height:1.25}
  .tile small{color:var(--muted);font-size:12px;margin-top:auto}
  .tile span{color:var(--gold2);font-weight:700;font-size:18px}
  @media(max-width:420px){.tiles{gap:8px}.tile{padding:10px;border-radius:12px}.tile b{font-size:13px}.tile span{font-size:16px}}
  .field{display:grid;gap:6px;margin-bottom:14px}
  .field label{font-size:13px;color:var(--muted)}
  .field input,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:15px Archivo,Verdana,sans-serif}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:16px;display:grid;gap:4px}
  .summary div{display:flex;justify-content:space-between;gap:10px}
  .summary span{color:var(--muted)}
  .m-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .m-foot .btn:disabled{opacity:.4;cursor:not-allowed}
  .done{text-align:center;padding:20px 0}
  .done .check{width:64px;height:64px;border-radius:50%;background:rgba(95,182,122,.15);color:var(--ok);font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .done p{color:var(--muted);margin:8px 0}
  .err{color:#e07b7b;font-size:13px;min-height:18px}

  /* owner panel */
  .bk{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .bk small{color:var(--muted);display:block}
  .bk button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;font:12px Archivo,Verdana,sans-serif;align-self:center}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}

  /* staff / admin panel */
  .modal.wide{max-width:980px}
  .pin{max-width:300px;margin:20px auto;text-align:center}
  .pin input{width:100%;text-align:center;font-size:26px;letter-spacing:.5em;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);margin:14px 0 8px}
  .pin input:focus{outline:none;border-color:var(--gold)}
  .abar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .dnav{display:flex;align-items:center;gap:8px}
  .dnav button{background:var(--card);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
  .dnav b{min-width:170px;text-align:center;font-size:15px}
  .abar .btn{padding:9px 16px;font-size:14px}
  .agrid{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow-y:auto}
  .agrid table{width:100%;min-width:540px;border-collapse:collapse;table-layout:fixed}
  .agrid table.one{min-width:0}
  .agrid th{position:sticky;top:0;background:var(--bg2);z-index:2;padding:10px 6px;font-size:14px;border-bottom:1px solid var(--line);text-align:left}
  .agrid th:first-child,.agrid td:first-child{width:62px;color:var(--muted);font-size:12px;text-align:center}
  .agrid td{border-bottom:1px solid #262b36;border-left:1px solid #262b36;height:42px;padding:3px;vertical-align:top}
  .cell-free{width:100%;height:100%;min-height:34px;background:none;border:1px dashed transparent;border-radius:8px;color:#3a404d;cursor:pointer;font:600 16px Archivo,Verdana,sans-serif}
  .cell-free:hover{border-color:var(--gold);color:var(--gold)}
  .cell-past{width:100%;height:100%;min-height:34px;border-radius:8px;background:repeating-linear-gradient(45deg,transparent 0 6px,#1c2029 6px 12px)}
  .bkc{width:100%;height:100%;border-radius:8px;padding:5px 8px;text-align:left;border:0;cursor:pointer;color:var(--text);font:12px/1.3 Archivo,Verdana,sans-serif;overflow:hidden;display:block}
  .bkc b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bkc span{color:var(--muted)}
  .src-web{background:#332a12;border-left:3px solid var(--gold)}
  .src-phone{background:#1c2a44;border-left:3px solid #5b82c4}
  .src-walkin{background:#1f3527;border-left:3px solid var(--ok)}
  .src-insta{background:#35203a;border-left:3px solid #c27bd1}
  .src-brk{background:repeating-linear-gradient(45deg,#2a2e38 0 8px,#232730 8px 16px);border-left:3px solid #6b7180}
  .alegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
  .alegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
  .aform{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .aform .full{grid-column:1/-1}
  .field select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:15px Archivo,Verdana,sans-serif}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;cursor:pointer;font:13px Archivo,Verdana,sans-serif}
  .seg button.on{border-color:var(--gold);background:#2b2512;color:var(--gold2)}
  .detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;font-size:14px}
  .detail div{display:flex;justify-content:space-between;gap:10px}
  .detail span{color:var(--muted)}
  .btn-danger{border-color:#6e3434;color:#e07b7b;background:transparent}
  .btn-danger:hover{background:#3a1f1f}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#0e1a12;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:600px){.aform{grid-template-columns:1fr}.dnav b{min-width:120px;font-size:13px}}

  /* notifications */
  .push{position:fixed;top:14px;right:14px;left:auto;width:min(360px,calc(100vw - 28px));z-index:90;background:rgba(40,44,54,.97);backdrop-filter:blur(12px);border:1px solid #3a404d;border-radius:18px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.55);display:flex;gap:12px;cursor:pointer;transform:translateY(-180%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),visibility .45s}
  .push.show{transform:translateY(0);visibility:visible}
  .push .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);color:var(--gold2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:Archivo,Verdana,sans-serif}
  .push .tp{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .push b{display:block;font-size:14px;margin:1px 0}
  .push p{font-size:13px;color:#d6d2ca;line-height:1.35}
  .bell{position:relative;background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:17px}
  .bell em{position:absolute;top:-6px;right:-6px;background:#d65a5a;color:#fff;font:700 11px Archivo,Verdana,sans-serif;font-style:normal;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .bkc.new{box-shadow:0 0 0 2px var(--gold) inset}
  .bkc .nb{float:right;background:var(--gold);color:#171310;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px}
  .nlist{display:grid;gap:8px}
  .nitem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
  .nitem.unread{border-color:var(--gold)}
  .nitem small{color:var(--muted);display:block}

  /* staff page (index.html#staff): public site hidden, panel is the page */
  body.staff-mode>header,body.staff-mode>main,body.staff-mode>footer,body.staff-mode>.mbook,body.staff-mode>#bookOv{display:none!important}
  .staff-mode #ownerOv{position:static;display:flex;background:none;backdrop-filter:none;min-height:100vh;align-items:flex-start;padding:28px 16px}
  .staff-mode #ownerOv .modal{max-height:none;border-radius:20px}
  .staff-mode #ownerOv .x{display:none}
  .staff-top{display:none}
  .staff-mode .staff-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:var(--gold2)}
  @media(max-width:600px){.staff-mode #ownerOv{padding:0}.staff-mode #ownerOv .modal{border-radius:0;border:0;min-height:100vh}}

  .bkc.pending{outline:1.5px dashed var(--gold2);outline-offset:-2px}
  .btn-ok{background:#1f7a45;color:#f2fff6}
  .btn-ok:hover{background:#24904f}
  .wa-prev{background:#0b3d2e;color:#e8f5ee;border-radius:12px 12px 12px 4px;padding:12px 14px;font-size:14px;line-height:1.45;max-width:420px;margin-top:6px}

  @media(max-width:860px){
    .links{display:none}
    .info{grid-template-columns:1fr}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .hero .pole{display:none}
    .motif{right:-120px;opacity:.05}
    .nav .btn-book{display:none}
    .mbook{display:flex}
    footer{padding-bottom:90px}
  }
</style>

const BARBERS=[{n:"Albin",i:"A"},{n:"Redon",i:"R"},{n:"Loris",i:"L"}];
// 30-minute slots, 10:00 – 20:30 start (closes 21:00)
const TIMES=[];for(let m=600;m<=1230;m+=30)TIMES.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
const slotsLen=svc=>Math.ceil(SVC[svc][1]/30);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- shared schedule (in the real version this lives in a database) ---------- */
let bookings=[];let nextId=1;
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){return new Date(k+'T00:00')}
function dayList(n=14){const a=[];const b=new Date();b.setHours(0,0,0,0);for(let i=0;i<n;i++){const d=new Date(b);d.setDate(b.getDate()+i);a.push(d)}return a}
function covering(barber,day,idx){return bookings.find(b=>b.barber===barber&&b.day===day&&idx>=b.slot&&idx<b.slot+b.len)}
function isPast(day,idx){const d=fromKey(day);const [h,m]=TIMES[idx].split(':');d.setHours(+h,+m);return d<=new Date()}
function canFit(barber,day,idx,len,checkPast=true){
  if(idx+len>TIMES.length)return false;
  if(checkPast&&isPast(day,idx))return false;
  for(let i=idx;i<idx+len;i++)if(covering(barber,day,i))return false;
  return true;
}
// demo data so the schedule looks lived-in
function seed(){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const names=["Arben K.","Driton M.","Luan B.","Faton H.","Blerim S.","Gent R.","Ilir D.","Valon T.","Egzon Q.","Kushtrim A."];
  const srcs=["web","web","web","phone","phone","walkin","insta"];
  dayList(14).forEach(d=>{const day=key(d);
    BARBERS.forEach((_,b)=>{
      for(let i=0;i<TIMES.length;i++){
        if(rnd()<0.3){const svc=Math.floor(rnd()*SVC.length),len=slotsLen(svc);
          if(canFit(b,day,i,len,false)){bookings.push({id:nextId++,barber:b,day,slot:i,len,svc,name:names[Math.floor(rnd()*names.length)],tel:"+383 4"+Math.floor(rnd()*9)+" "+String(Math.floor(rnd()*900)+100)+" "+String(Math.floor(rnd()*900)+100),src:srcs[Math.floor(rnd()*srcs.length)],notes:"",status:rnd()<0.25?"pending":"confirmed",lang:["sq","sq","sq","en","de"][Math.floor(rnd()*5)]});i+=len-1}}
      }
      if(rnd()<0.6){const i=6+Math.floor(rnd()*4);if(canFit(b,day,i,1,false))bookings.push({id:nextId++,barber:b,day,slot:i,len:1,svc:null,name:"",tel:"",src:"brk",notes:""})}
    });
  });
}

/* ---------- customer booking ---------- */
function openBook(pre={}){
  st={step:0,svc:null,barber:null,day:null,time:null,name:"",tel:"",notes:"",done:false,skipBarber:false};
  if(pre.svc!==undefined){st.svc=pre.svc;st.step=1}
  if(pre.barber!==undefined){st.barber=pre.barber;st.skipBarber=true}
  document.getElementById('bookOv').classList.add('show');document.body.style.overflow='hidden';
  renderStep();
}
function customerSlots(day){
  const len=slotsLen(st.svc);
  return TIMES.map((time,idx)=>{
    const ok=st.barber===-1?BARBERS.some((_,b)=>canFit(b,day,idx,len)):canFit(st.barber,day,idx,len);
    return {time,idx,taken:!ok};
  });
}
function pick(field,val){
  st[field]=val;st.time=null;renderStep();
  clearTimeout(pick.h);pick.h=setTimeout(()=>go(1),220);
}
function renderStep(){
  const body=document.getElementById('stepBody'),next=document.getElementById('nextBtn'),back=document.getElementById('backBtn'),foot=document.getElementById('mFoot');
  document.getElementById('err').textContent='';
  document.getElementById('steps').innerHTML=[0,1,2,3].map(i=>`<i class="${i<=st.step||st.done?'on':''}"></i>`).join('');
  foot.style.display=st.done?'none':'flex';
  back.style.visibility=st.step===0?'hidden':'visible';
  next.textContent=st.step===3?t('confirm'):t('next');
  next.style.visibility=st.step<2?'hidden':'visible';
  if(st.done){
    const b=st.done;
    body.innerHTML=`<div class="done"><div class="check">✓</div><h3 class="serif" style="font-size:26px">${t('doneH')}</h3>
      <p>${t('svcs')[b.svc][0]} · ${BARBERS[b.barber].n}<br>${fmtDay(fromKey(b.day),{weekday:'long',day:'numeric',month:'long'})} · ${TIMES[b.slot]}</p>
      <p>${t('doneP')}</p><p style="font-size:13px">${t('cancelInfo')}</p>
      <button class="btn btn-gold" style="margin-top:14px" onclick="closeAll()">${t('doneBtn')}</button></div>`;
    return;
  }
  if(st.step===0){
    body.innerHTML=`<div class="step-title">${t('s1')}</div><div class="tiles">`+t('svcs').map((s,i)=>`
      <button class="tile ${st.svc===i?'sel':''}" onclick="pick('svc',${i})"><b>${s[0]}</b><small>${SVC[i][1]} ${t('min')}</small><span>€${SVC[i][0]}</span></button>`).join('')+`</div>`;
    next.disabled=st.svc===null;
  }
  if(st.step===1){
    const opts=[{i:-1,n:t('any'),s:t('anySub'),a:'★'}].concat(BARBERS.map((b,i)=>({i,n:b.n,s:'Barber',a:b.i})));
    body.innerHTML=`<div class="step-title">${t('s2')}</div><div class="opts">`+opts.map(o=>`
      <button class="opt ${st.barber===o.i?'sel':''}" onclick="pick('barber',${o.i})"><div class="l"><div class="avatar">${o.a}</div><div><b>${o.n}</b><br><small>${o.s}</small></div></div></button>`).join('')+`</div>`;
    next.disabled=st.barber===null;
  }
  if(st.step===2){
    const days=dayList();if(!st.day)st.day=key(days[0]);
    const slots=customerSlots(st.day);
    body.innerHTML=`<div class="step-title">${t('s3')}</div>
      <div class="days">`+days.map((d,i)=>`<button class="day ${key(d)===st.day?'sel':''}" onclick="st.day='${key(d)}';st.time=null;renderStep()"><small>${i===0?t('today'):fmtDay(d,{weekday:'short'})}</small><b>${d.getDate()}</b><small>${fmtDay(d,{month:'short'})}</small></button>`).join('')+`</div>
      ${slots.every(s=>s.taken)?`<p class="note">${t('noSlots')}</p>`:''}
      <div class="slots">`+slots.map(s=>`<button class="slot ${st.time===s.idx?'sel':''}" ${s.taken?'disabled':''} onclick="st.time=${s.idx};renderStep()">${s.time}</button>`).join('')+`</div>
      <div class="legend"><span>▢ ${t('free')}</span><span style="text-decoration:line-through">${t('taken')}</span></div>`;
    next.disabled=st.time===null;
  }
  if(st.step===3){
    body.innerHTML=`<div class="step-title">${t('s4')}</div>
      <div class="summary">
        <div><span>${t('sum').svc}</span><b>${t('svcs')[st.svc][0]}</b></div>
        <div><span>${t('sum').barber}</span><b>${barberName(st.barber)}</b></div>
        <div><span>${t('sum').when}</span><b>${fmtDay(fromKey(st.day),{weekday:'short',day:'numeric',month:'short'})} · ${TIMES[st.time]}</b></div>
        <div><span>${t('sum').price}</span><b>€${SVC[st.svc][0]}</b></div>
      </div>
      <div class="field"><label>${t('name')}</label><input id="fName" value="${esc(st.name)}" oninput="st.name=this.value" autocomplete="name"></div>
      <div class="field"><label>${t('tel')}</label><input id="fTel" value="${esc(st.tel)}" oninput="st.tel=this.value" placeholder="+383 4x xxx xxx" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label>${t('notes')}</label><textarea rows="2" oninput="st.notes=this.value">${esc(st.notes)}</textarea></div>`;
    next.disabled=false;
  }
}
function go(dir){
  if(dir>0&&st.step===3){
    if(st.name.trim().length<2||st.tel.replace(/\D/g,'').length<8){document.getElementById('err').textContent=t('errName');return}
    const len=slotsLen(st.svc);
    const barber=st.barber===-1?BARBERS.findIndex((_,b)=>canFit(b,st.day,st.time,len)):st.barber;
    if(barber<0||!canFit(barber,st.day,st.time,len)){st.step=2;st.time=null;renderStep();return}
    const b={id:nextId++,barber,day:st.day,slot:st.time,len,svc:st.svc,name:st.name.trim(),tel:st.tel.trim(),notes:st.notes,src:"web",status:"pending",lang};
    bookings.push(b);persist();st.done=b;renderStep();notify(b);return;
  }
  let s=st.step+dir;
  if(st.skipBarber&&s===1)s+=dir;
  st.step=Math.max(0,Math.min(3,s));renderStep();
}

function openFromPush(){
  document.getElementById('push').classList.remove('show');
  const b=bookings.find(x=>x.id===lastPush);if(!b)return;
  closeAll();openOwner();adm.day=b.day;
  if(adm.auth&&!mine(b)){adm.auth=false;adm.user=null}
  if(!adm.auth)adm.pick=b.barber;
  if(adm.auth){adm.sel=b.id;adm.view='detail';markRead(b.id)}
  renderAdmin();
}
function markRead(id){notifs.forEach(n=>{if(n.bid===id)n.read=true});persist()}
function mine(b){return adm.user===-1||adm.user===null||b.barber===adm.user}
function unread(){return notifs.filter(n=>!n.read&&bookings.some(b=>b.id===n.bid&&mine(b))).length}
function isNew(id){return notifs.some(n=>n.bid===id&&!n.read)}


/* ---------- confirming bookings to the client ---------- */
function waNumber(tel){let d=String(tel).replace(/[^\d+]/g,'');if(d.startsWith('+'))d=d.slice(1);else if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='383'+d.slice(1);return d}
function clientMsg(b,kind){
  const L=b.lang||'sq',T2=T[L];
  return T2[kind==='ok'?'msgOk':'msgNo']
    .replace('{name}',b.name.split(' ')[0]).replace('{barber}',BARBERS[b.barber].n)
    .replace('{date}',fromKey(b.day).toLocaleDateString(LOC[L],{weekday:'long',day:'numeric',month:'long'}))
    .replace('{time}',TIMES[b.slot]).replace('{service}',T2.svcs[b.svc][0]);
}
function openWhatsApp(b,kind){
  const url='https://wa.me/'+waNumber(b.tel)+'?text='+encodeURIComponent(clientMsg(b,kind));
  window.__lastWa=url; try{window.open(url,'_blank')}catch(e){}
}
function confirmBooking(id){const b=bookings.find(x=>x.id===id);if(!b)return;b.status='confirmed';markRead(id);persist();openWhatsApp(b,'ok');renderAdmin();toast(t('confirmedToast'))}
function declineBooking(id){const b=bookings.find(x=>x.id===id);if(!b)return;openWhatsApp(b,'no');bookings=bookings.filter(x=>x.id!==id);persist();adm.view='grid';renderAdmin();toast(t('declinedToast'))}

/* ---------- staff panel ---------- */
let adm={auth:false,user:null,pick:null,day:null,view:'grid',sel:null,f:{}};
function openOwner(){
  if(!adm.day)adm.day=key(new Date());
  if(!adm.auth)adm.pick=null;
  adm.view='grid';
  document.getElementById('ownerOv').classList.add('show');document.body.style.overflow='hidden';
  renderAdmin();
}
function shiftDay(n){const d=fromKey(adm.day);d.setDate(d.getDate()+n);adm.day=key(d);renderAdmin()}
function login(){
  const v=document.getElementById('pinIn').value;
  const PINS={0:'1111',1:'2222',2:'3333','-1':'1234'};
  if(adm.pick!==null&&v===PINS[adm.pick]){adm.auth=true;adm.user=adm.pick;adm.view='grid';renderAdmin()}else{document.getElementById('pinErr').textContent=t('pinErr')}
}
function startAdd(barber=null,slot=null){
  if(barber===null)barber=adm.user>=0?adm.user:0;
  adm.f={barber,day:adm.day,slot,src:'phone',svc:0,brkLen:1,name:'',tel:'',notes:''};
  adm.view='form';renderAdmin();
}
function formLen(){return adm.f.src==='brk'?adm.f.brkLen:slotsLen(adm.f.svc)}
function saveAdd(){
  const f=adm.f,len=formLen();
  if(adm.user>=0)f.barber=adm.user;
  if(f.slot===null||!canFit(f.barber,f.day,f.slot,len,false))return;
  bookings.push({id:nextId++,barber:f.barber,day:f.day,slot:f.slot,len,svc:f.src==='brk'?null:f.svc,
    name:f.name.trim()||(f.src==='walkin'?t('walkinName'):''),tel:f.tel.trim(),notes:f.notes,src:f.src});
  persist();adm.day=f.day;adm.view='grid';renderAdmin();toast(t('saved'));
}
function delBooking(id){bookings=bookings.filter(b=>b.id!==id);persist();adm.view='grid';renderAdmin();toast(t('deleted'))}

/* ---------- demo data store ----------
   In the demo the schedule is kept in this browser, so the public page and the
   staff page (index.html#staff) share it between tabs. The real version uses a database. */
function persist(){try{localStorage.setItem('bb_data',JSON.stringify({day:key(new Date()),nextId,bookings,notifs:notifs.map(n=>({...n,at:n.at.toISOString()}))}))}catch(e){}}
function loadData(){
  try{const d=JSON.parse(localStorage.getItem('bb_data')||'null');
    if(!d||d.day!==key(new Date()))return false;
    bookings=d.bookings;nextId=d.nextId;notifs=d.notifs.map(n=>({...n,at:new Date(n.at)}));return true;
  }catch(e){return false}
}
function resetDemo(){bookings=[];notifs=[];nextId=1;seed();persist();adm.view='grid';renderAdmin();toast(t('resetDone'))}
window.addEventListener('storage',e=>{
  if(e.key!=='bb_data')return;
  const known=new Set(bookings.map(b=>b.id)),seen=new Set(notifs.map(n=>n.bid));
  if(!loadData())return;
  if(isStaff()){
    bookings.filter(b=>b.src==='web'&&!known.has(b.id)).forEach(showPush);
    renderAdmin();
  }
});

  const on=location.hash==='#staff'||/[?&]staff\b/.test(location.search);

  if(on){document.title='Barbershop Bingo · Staff';openOwner()}
  else{document.getElementById('ownerOv').classList.remove('show');document.body.style.overflow=''}
}
window.addEventListener('hashchange',checkStaff);
if(!loadData()){seed();persist()}
checkStaff();
